# AM6 시즌 설정 — 회원 명단과 파워랭킹 가중치
# (구글 시트 Summary_sheet의 회원 목록 / 가중치 테이블을 옮긴 것)

season: "25-26"
period: "2025.12 – 2026.11"
team_name: "AM6"

# 종합포인트 가중치 (Summary_sheet '가중치 테이블 (25-26 1Q)')
weights:
  attendance: 10          # 출석 1회당
  풋살:  {win: 2,  goal: 2}
  "8:8":   {win: 5,  goal: 4,  assist: 2, clean_sheet: 2}
  "9:9":   {win: 5,  goal: 5,  assist: 3, clean_sheet: 3}
  "11:11": {win: 10, goal: 10, assist: 5, clean_sheet: 3}
  referee: 2              # 주심 (쿼터당)
  assistant_referee: 1    # 부심 (쿼터당)

# 요약 탭 출석 패널 (true면 표시). 새 시즌은 꺼진 채로 시작하니 기록이 쌓이면 켠다.
features:
  absence: true        # 보고 싶은 얼굴: 3경기 이상 연속 결장한 정회원
  streak: true         # 연속 출석: 최근 경기까지 2경기 이상 연속 출석
  rank_preview: true   # 다음 경기에 나오면: 평소 경기당 포인트로 계산한 예상 순위 상승

# 수동 보정: 원본 기록과 다르게 집계해야 할 때 (값만큼 더하거나 뺌)
adjustments:
  - name: 김상범
    "8:8": {clean_sheet: -1}   # 구글 시트 Summary_sheet J2에 0으로 직접 입력돼 있던 값 재현

# 파워랭킹 대상. 여기 없는 이름은 '게스트'로 표시되고 파워랭킹에서 빠진다.
