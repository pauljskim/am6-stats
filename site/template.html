<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 매치데이 프로그램 — 고정 헤더(시즌·탭) 아래 한 칼럼 피드, 넓은 화면에서 리더보드만 그리드로 펼침 */
:root {
  --bg: #f2f4ef;
  --surface: #ffffff;
  --sunken: #e8ece5;
  --ink: #15201a;
  --muted: #5d6a62;
  --line: #d9dfd7;
  --pitch: #1c6a46;
  --pitch-soft: #e1eee5;
  --on-pitch: #ffffff;
  --gold: #c98f00;
  --gold-soft: #fbf0d0;
  --up: #1d8049;
  --down: #c03d2a;
  --futsal: #2d5ca6;
  --futsal-soft: #e3eaf6;
  --s1: #e4f0e8; --s2: #bcdcc7; --s3: #86bf9c; --s4: #3f9568; --s5: #1c6a46;
  --s-ink: #15201a; --s-ink-hi: #ffffff;
  --font-display: "Black Han Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "Barlow Condensed", "IBM Plex Sans KR", "Arial Narrow", sans-serif;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1410; --surface: #151f19; --sunken: #1b2720; --ink: #e3ebe5; --muted: #93a399;
    --line: #26332b; --pitch: #52c08a; --pitch-soft: #1a3325; --on-pitch: #08130d;
    --gold: #f0bf4c; --gold-soft: #3a2f12; --up: #57c78d; --down: #f2806b;
    --futsal: #86a9ef; --futsal-soft: #1c2840; color-scheme: dark;
    --s1: #1c2e23; --s2: #255038; --s3: #347a53; --s4: #4fb07f; --s5: #92dcb4; --s-ink: #e3ebe5; --s-ink-hi: #08130d;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1410; --surface: #151f19; --sunken: #1b2720; --ink: #e3ebe5; --muted: #93a399;
  --line: #26332b; --pitch: #52c08a; --pitch-soft: #1a3325; --on-pitch: #08130d;
  --gold: #f0bf4c; --gold-soft: #3a2f12; --up: #57c78d; --down: #f2806b;
  --futsal: #86a9ef; --futsal-soft: #1c2840; color-scheme: dark;
    --s1: #1c2e23; --s2: #255038; --s3: #347a53; --s4: #4fb07f; --s5: #92dcb4; --s-ink: #e3ebe5; --s-ink-hi: #08130d;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }   /* section.view의 display:flex가 hidden을 덮어쓰지 않게 */
img { max-width: 100%; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--font-body);
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pitch); outline-offset: 2px; border-radius: 4px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }

/* ── header ── */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; }
.mast { display: flex; align-items: center; gap: 12px; padding-block: 12px 8px; }
.crest {
  font-family: var(--font-display); font-size: 26px; line-height: 1; letter-spacing: .02em;
  color: var(--pitch);
}
.mast-meta { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.mast-meta b { font-size: 15px; }
.mast-meta span { font-size: 12px; color: var(--muted); }
.season-pick { margin-left: auto; position: relative; }
.season-pick select {
  appearance: none; -webkit-appearance: none; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 6px 30px 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
}
.season-pick::after {
  content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; margin-top: -5px;
  border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg);
  pointer-events: none;
}
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 0; background: none; padding: 7px 14px; border-radius: 999px;
  font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer;
}
.tab:hover { color: var(--ink); background: var(--sunken); }
.tab[aria-selected="true"] { background: var(--pitch); color: var(--on-pitch); }

main { padding-block: 20px 56px; }
section.view { display: flex; flex-direction: column; gap: 28px; }
h2 {
  margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--muted);
  text-transform: uppercase; text-wrap: balance;
}
.head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hint { font-size: 12px; color: var(--muted); }
.block { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

/* ── chips ── */
.type {
  display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px;
  background: var(--pitch-soft); color: var(--pitch); white-space: nowrap; line-height: 1.5;
}
.type.futsal { background: var(--futsal-soft); color: var(--futsal); }
.guest { font-size: 10px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; margin-left: 4px; vertical-align: 1px; }
.d { font-size: 11px; font-weight: 700; white-space: nowrap; font-family: var(--font-num); letter-spacing: .02em; }
.d.up { color: var(--up); } .d.down { color: var(--down); } .d.same { color: var(--muted); opacity: .6; }
.d.new { color: var(--gold); }

/* ── latest game ── */
.latest {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  display: grid; grid-template-columns: minmax(0, 1fr); overflow: hidden;
}
.latest-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 14px 16px 0; font-size: 13px; color: var(--muted); }
.latest-head .rnd { font-family: var(--font-display); font-size: 18px; color: var(--ink); letter-spacing: .01em; }
.board-score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 14px 16px 6px; }
.side { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.side.r { text-align: right; }
.side .tn { font-weight: 700; font-size: 17px; }
.side .tn.win::after { content: " 승"; font-size: 11px; font-weight: 700; color: var(--pitch); vertical-align: 2px; }
.side .sc { font-size: 12px; color: var(--muted); }
.score { font-family: var(--font-num); font-weight: 700; font-size: 48px; line-height: 1; display: flex; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; }
.score .colon { color: var(--muted); font-size: 32px; }
.score .lose { color: var(--muted); }
.qline { display: flex; justify-content: center; gap: 14px; padding: 0 16px 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.qline span b { font-family: var(--font-num); font-size: 14px; color: var(--ink); font-weight: 600; }
.latest-body { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; border-top: 1px dashed var(--line); margin-top: 6px; }
.kv { display: flex; gap: 10px; font-size: 13px; align-items: baseline; }
.kv > b { flex: 0 0 34px; color: var(--muted); font-weight: 600; font-size: 12px; }
.kv > div { min-width: 0; }
.name-list { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.name-list .cnt { font-family: var(--font-num); font-weight: 700; color: var(--pitch); margin-left: 2px; }
.futsal-hero { display: flex; align-items: flex-end; gap: 22px; padding: 14px 16px 6px; flex-wrap: wrap; }
.big { display: flex; flex-direction: column; }
.big .num { font-size: 44px; font-weight: 700; line-height: 1; }
.big small { font-size: 12px; color: var(--muted); }

/* ── season strip ── */
.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.strip > div { padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.strip > div + div { border-left: 1px solid var(--line); }
.strip .num { font-size: 28px; font-weight: 700; line-height: 1.05; }
.strip small { font-size: 12px; color: var(--muted); }
@media (max-width: 560px) {
  .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .strip > div:nth-child(3) { border-left: 0; }
  .strip > div:nth-child(n+3) { border-top: 1px solid var(--line); }
}

/* ── leaderboards ── */
.boards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.lb { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-width: 0; }
.lb-h { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 14px 8px; gap: 8px; }
.lb-h h3 { margin: 0; font-size: 15px; font-weight: 700; }
.lb-h span { font-size: 11px; color: var(--muted); }
.lb ol { list-style: none; margin: 0; padding: 0 6px 6px; }
.lb li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 6px; }
.lb li.first { background: var(--gold-soft); }
.lb .rk { font-family: var(--font-num); font-weight: 700; font-size: 16px; color: var(--muted); text-align: center; }
.lb li.first .rk { color: var(--gold); }
.lb .val { font-family: var(--font-num); font-weight: 700; font-size: 17px; text-align: right; min-width: 34px; font-variant-numeric: tabular-nums; }
.lb .val small { font-size: 11px; color: var(--muted); font-weight: 500; margin-left: 3px; font-family: var(--font-body); }
.pname { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pname:hover { color: var(--pitch); text-decoration: underline; text-underline-offset: 3px; }
.more { border: 0; border-top: 1px solid var(--line); background: none; padding: 9px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; border-radius: 0 0 var(--r) var(--r); margin-top: auto; }
.more:hover { color: var(--pitch); background: var(--sunken); }

/* ── tables ── */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
tbody tr:last-child td { border-bottom: 0; }
th { font-size: 11px; font-weight: 700; color: var(--muted); background: var(--sunken); position: sticky; top: 0; letter-spacing: .02em; }
th.l, td.l { text-align: left; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--ink); }
th.sorted { color: var(--pitch); }
th.sorted::after { content: " ↓"; }
th.sorted.asc::after { content: " ↑"; }
td.num { font-size: 15px; font-weight: 600; }
td .zero, .zero { color: var(--muted); opacity: .45; }
.sticky-col { position: sticky; left: 0; background: var(--surface); z-index: 1; }
th.sticky-col { background: var(--sunken); z-index: 2; }
tr.grp td { background: var(--sunken); font-size: 11px; font-weight: 700; color: var(--muted); text-align: left; }
.ptbar { display: inline-block; height: 6px; border-radius: 3px; background: var(--pitch); opacity: .8; vertical-align: middle; margin-right: 8px; }
.group-head th { background: var(--surface); border-bottom: 0; padding-bottom: 0; text-align: center; color: var(--pitch); }

/* ── weights ── */
details.note { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
details.note > summary { padding: 12px 14px; cursor: pointer; font-weight: 600; font-size: 14px; list-style: none; display: flex; justify-content: space-between; }
details.note > summary::-webkit-details-marker { display: none; }
details.note > summary::after { content: "+"; color: var(--muted); font-weight: 700; }
details.note[open] > summary::after { content: "–"; }
details.note .inner { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: var(--muted); }
details.note table { font-size: 13px; }
details.note .tbl-wrap { background: var(--bg); }

/* ── games ── */
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); }
.fchip[aria-pressed="true"] { border-color: var(--pitch); color: var(--pitch); background: var(--pitch-soft); }
.games { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.month { padding: 8px 14px; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--sunken); border-bottom: 1px solid var(--line); letter-spacing: .04em; }
details.game { border-bottom: 1px solid var(--line); }
details.game:last-child { border-bottom: 0; }
details.game > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; }
details.game > summary::-webkit-details-marker { display: none; }
details.game > summary:hover { background: var(--sunken); }
details.game[open] > summary { background: var(--sunken); }
.gdate { display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.gdate .num { font-size: 22px; font-weight: 700; }
.gdate small { font-size: 11px; color: var(--muted); }
.gmain { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.gmain .t { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.gmain .t b { color: var(--ink); font-size: 13px; }
.gmain .res { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gmain .res .w { color: var(--pitch); }
.gmain .res .num { font-size: 18px; font-weight: 700; }
.gside { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.gbody { padding: 4px 14px 16px 78px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
@media (max-width: 560px) { .gbody { padding-left: 14px; } }
.qt { width: auto; min-width: 220px; }
.qt td, .qt th { padding: 5px 10px; }
.rosters { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.roster { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.roster b { font-size: 12px; }
.roster div { font-size: 13px; color: var(--muted); }
.venues { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.venues b { color: var(--ink); font-weight: 600; }

/* ── players ── */
.search { position: relative; }
.search input {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r);
  padding: 12px 14px 12px 40px; font-size: 16px;
}
.search input:focus { outline: 2px solid var(--pitch); outline-offset: -1px; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.roster-pick { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; }
.pchip .num { font-size: 12px; color: var(--muted); font-weight: 600; }
.pchip:hover { border-color: var(--pitch); }
.pchip[aria-pressed="true"] { background: var(--pitch); border-color: var(--pitch); color: var(--on-pitch); }
.pchip[aria-pressed="true"] .num { color: inherit; opacity: .8; }
.pchip.dim { opacity: .55; }
.plist { display: flex; flex-direction: column; gap: 10px; }
details.others { background: var(--sunken); border: 1px solid var(--line); border-radius: var(--r); }
details.others > summary {
  list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: baseline;
  padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--muted);
}
details.others > summary::-webkit-details-marker { display: none; }
details.others > summary .num { font-size: 15px; color: var(--ink); margin-left: 2px; }
details.others > summary::after { content: "펼치기 +"; font-size: 12px; font-weight: 600; }
details.others[open] > summary::after { content: "접기 –"; }
details.others > summary:hover { color: var(--ink); }
details.others .roster-pick { padding: 0 12px 12px; }
.empty { padding: 18px; text-align: center; color: var(--muted); font-size: 14px; border: 1px dashed var(--line); border-radius: var(--r); }

.profile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; overflow: hidden; }
.pf-head { display: flex; align-items: center; gap: 14px; padding: 16px; flex-wrap: wrap; }
.kit {
  width: 56px; height: 56px; border-radius: 12px; background: var(--pitch); color: var(--on-pitch);
  display: grid; place-items: center; font-family: var(--font-num); font-weight: 700; font-size: 26px; flex: 0 0 auto;
}
.kit.guestkit { background: var(--sunken); color: var(--muted); font-size: 14px; font-family: var(--font-body); }
.pf-name { display: flex; flex-direction: column; min-width: 0; gap: 2px; }
.pf-name b { font-family: var(--font-display); font-size: 26px; line-height: 1.1; font-weight: 400; }
.pf-name span { font-size: 13px; color: var(--muted); }
.pf-rank { margin-left: auto; text-align: right; display: flex; flex-direction: column; }
.pf-rank .num { font-size: 34px; font-weight: 700; line-height: 1; }
.pf-rank small { font-size: 12px; color: var(--muted); }
.pf-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); border-top: 1px solid var(--line); }
.pf-stats > div { padding: 10px 14px; display: flex; flex-direction: column; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: -1px; }
.pf-stats .num { font-size: 24px; font-weight: 700; line-height: 1.1; }
.pf-stats small { font-size: 11px; color: var(--muted); }
.pf-sec { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); min-width: 0; }
.pf-sec h4 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
.attend { display: grid; grid-template-columns: repeat(auto-fill, minmax(20px, 1fr)); gap: 4px; }
.attend i { aspect-ratio: 1; max-width: 100%; border-radius: 4px; background: var(--sunken); border: 1px solid var(--line); display: block; }
.attend i.f { background: var(--pitch); border-color: var(--pitch); }
.attend i.s { background: var(--futsal); border-color: var(--futsal); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; align-items: center; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.stack { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--sunken); }
.stack span { display: block; height: 100%; }
.stack-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.stack-legend b { color: var(--ink); font-family: var(--font-num); font-size: 14px; margin-left: 3px; }
.res-w { color: var(--pitch); font-weight: 700; }
.res-l { color: var(--muted); }

/* ── synergy ── */
.pairs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; }
.pairs { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-width: 0; }
.pairs .lb-h { padding-bottom: 4px; }
.pairs ol { list-style: none; margin: 0; padding: 0 6px 8px; }
.pairs li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 8px; }
.pairs li + li { border-top: 1px solid var(--line); }
.duo { display: flex; align-items: baseline; gap: 6px; min-width: 0; flex-wrap: wrap; }
.duo .plus { color: var(--muted); font-size: 12px; }
.pmeta { grid-column: 1 / -1; font-size: 12px; color: var(--muted); display: flex; gap: 4px 10px; flex-wrap: wrap; }
.pmeta b { color: var(--ink); font-family: var(--font-num); font-size: 13px; font-weight: 600; }
.pips { display: inline-flex; gap: 3px; align-items: center; }
.pips i { width: 14px; height: 8px; border-radius: 2px; background: var(--sunken); display: block; }
.pips i.on1 { background: var(--s1); box-shadow: inset 0 0 0 1px var(--s2); } .pips i.on2 { background: var(--s2); }
.pips i.on3 { background: var(--s3); } .pips i.on4 { background: var(--s4); } .pips i.on5 { background: var(--s5); }
.pips .num { font-size: 15px; font-weight: 700; margin-left: 5px; min-width: 10px; }
.partner { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; }
.partner-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.partner-head select {
  appearance: none; -webkit-appearance: none; border: 1px solid var(--line); background-color: var(--bg);
  border-radius: 8px; padding: 8px 32px 8px 12px; font-size: 16px; font-weight: 700; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: right 14px center, right 9px center; background-size: 5px 5px; background-repeat: no-repeat;
}
.partner-head .hint { margin-left: auto; }
.partner-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.partner-cols > div { padding: 12px 10px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.partner-cols > div + div { border-left: 1px solid var(--line); }
@media (max-width: 660px) { .partner-cols > div + div { border-left: 0; border-top: 1px solid var(--line); } }
.partner-cols h4 { margin: 0 6px 4px; font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 7px 6px; align-items: center; }
.prow .pmeta { font-size: 11px; }
details.allp { border-top: 1px solid var(--line); }
details.allp > summary { list-style: none; cursor: pointer; padding: 10px 16px; font-size: 13px; font-weight: 600; color: var(--muted); }
details.allp > summary::-webkit-details-marker { display: none; }
details.allp > summary:hover { color: var(--ink); }
details.allp .tbl-wrap { border: 0; border-top: 1px solid var(--line); border-radius: 0 0 var(--r) var(--r); }
.mx-tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 13px; }
.mx-tools label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; color: var(--muted); }
.mx-tools input { accent-color: var(--pitch); width: 16px; height: 16px; margin: 0; }
.scale { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.scale span { display: inline-flex; gap: 2px; }
.scale i { width: 18px; height: 14px; border-radius: 3px; display: block; font-style: normal; font-size: 10px; line-height: 14px; text-align: center; font-family: var(--font-num); font-weight: 700; }
.readout { min-height: 46px; display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); font-size: 13px; color: var(--muted); }
.readout b { color: var(--ink); }
.readout .pmeta { grid-column: auto; }
.mx-wrap { overflow: auto; max-height: 78vh; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.mx { border-collapse: separate; border-spacing: 2px; width: auto; font-size: 11px; }
table.mx th, table.mx td { padding: 0; border: 0; text-align: center; white-space: nowrap; }
table.mx thead th { position: sticky; top: 0; z-index: 2; background: var(--surface); height: 64px; vertical-align: bottom; padding-bottom: 4px; font-weight: 600; color: var(--muted); font-size: 11px; letter-spacing: 0; }
table.mx thead th span { writing-mode: vertical-rl; display: inline-block; line-height: 1; }
table.mx thead th.corner { left: 0; z-index: 3; }
table.mx tbody th { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: right; padding: 0 8px 0 6px; font-weight: 600; font-size: 12px; color: var(--ink); cursor: pointer; border-radius: 4px; }
table.mx tbody th:hover { color: var(--pitch); }
table.mx td { width: 26px; min-width: 26px; height: 26px; border-radius: 4px; font-family: var(--font-num); font-weight: 700; font-size: 13px; color: var(--s-ink); }
table.mx td.c1 { background: var(--s1); } table.mx td.c2 { background: var(--s2); } table.mx td.c3 { background: var(--s3); }
table.mx td.c4 { background: var(--s4); color: var(--s-ink-hi); } table.mx td.c5 { background: var(--s5); color: var(--s-ink-hi); }
table.mx td.weak { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); font-weight: 500; font-size: 11px; }
table.mx td.self { background: var(--line); }
table.mx td.none { background: transparent; }
table.mx.hide-weak td.weak { color: transparent; box-shadow: none; }
table.mx tr.hl th, table.mx th.hl { color: var(--pitch); }
table.mx td.hl { outline: 2px solid var(--ink); outline-offset: -1px; }
table.mx tr.sel th { color: var(--on-pitch); background: var(--pitch); }

footer { font-size: 12px; color: var(--muted); padding-block: 0 32px; }
@media (prefers-reduced-motion: no-preference) {
  .view { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="mast">
      <span class="crest" id="crest">AM6</span>
      <div class="mast-meta"><b id="mast-title"></b><span id="mast-sub"></span></div>
      <label class="season-pick"><span hidden>시즌</span><select id="season" aria-label="시즌 선택"></select></label>
    </div>
    <nav class="tabs" role="tablist" aria-label="보기">
      <button class="tab" role="tab" data-tab="summary" id="tab-summary">요약</button>
      <button class="tab" role="tab" data-tab="ranking" id="tab-ranking">파워랭킹</button>
      <button class="tab" role="tab" data-tab="games" id="tab-games">경기 기록</button>
      <button class="tab" role="tab" data-tab="synergy" id="tab-synergy">시너지</button>
      <button class="tab" role="tab" data-tab="players" id="tab-players">선수 검색</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="view-summary"></section>
  <section class="view" id="view-ranking" hidden></section>
  <section class="view" id="view-games" hidden></section>
  <section class="view" id="view-synergy" hidden></section>
  <section class="view" id="view-players" hidden></section>
</main>
<footer class="wrap" id="foot"></footer>

<script>
const DATA = /*__DATA__*/null;
const NAV = /*__NAV__*/null;
</script>
<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const store = {
    get(k) { try { return localStorage.getItem('am6:' + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem('am6:' + k, v); } catch (e) {} },
  };
  const WD = ['일','월','화','수','목','금','토'];
  const md = d => { const [y, m, dd] = d.split('-'); return `${+m}.${+dd}`; };
  const wd = d => WD[new Date(d + 'T00:00:00').getDay()];
  const isFutsal = t => t === '풋살';
  const typeChip = t => `<span class="type${isFutsal(t) ? ' futsal' : ''}">${esc(t)}</span>`;
  const zero = (v, fmt = x => x) => v ? fmt(v) : `<span class="zero">0</span>`;
  const P = Object.fromEntries(DATA.players.map(p => [p.name, p]));
  const G = Object.fromEntries(DATA.games.map(g => [g.id, g]));
  const members = DATA.players.filter(p => p.member);
  const guestTag = n => P[n] && !P[n].member ? '<span class="guest">게스트</span>' : '';
  const pbtn = n => `<button class="pname" data-player="${esc(n)}">${esc(n)}</button>${guestTag(n)}`;

  function deltaHtml(d) {
    if (d === null || d === undefined) return '<span></span>';
    if (d === 'new') return '<span class="d new" title="새로 진입">NEW</span>';
    if (d > 0) return `<span class="d up" title="지난 경기 대비 ${d}계단 상승">▲${d}</span>`;
    if (d < 0) return `<span class="d down" title="지난 경기 대비 ${-d}계단 하락">▼${-d}</span>`;
    return '<span class="d same" title="변동 없음">–</span>';
  }

  // ── header ──
  const latestGame = DATA.games[DATA.games.length - 1];
  $('#crest').textContent = DATA.team;
  $('#mast-title').textContent = `${DATA.season} 시즌`;
  $('#mast-sub').textContent = latestGame
    ? `${DATA.period ? DATA.period + ' · ' : ''}Round ${latestGame.round}까지 반영`
    : DATA.period;
  const sel = $('#season');
  [...NAV.seasons].reverse().forEach(s => {
    const o = document.createElement('option');
    o.value = s; o.textContent = `${s} 시즌` + (s === NAV.seasons[NAV.seasons.length - 1] ? ' (현재)' : '');
    if (s === NAV.current) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener('change', () => { location.href = NAV.base + sel.value + '/' + location.hash; });
  $('#foot').innerHTML = `${esc(DATA.team)} ${esc(DATA.season)} 시즌 · 총 ${DATA.total_games}경기 · ${esc(DATA.built_at)} 업데이트`;

  // ── summary ──
  function gameScoreHtml(g) {
    if (isFutsal(g.type) || !g.teams || !g.teams.length) return '';
    const [a, b] = g.teams;
    if (!b) return '';
    const sc = t => t.goals === null ? '?' : t.goals;
    const cls = (t, o) => (o.win && !t.win) ? 'lose' : '';
    return `
      <div class="board-score">
        <div class="side"><span class="tn${a.win ? ' win' : ''}">${esc(a.name)}${a.external ? '' : ' 팀'}</span><span class="sc">${a.players.length ? a.players.length + '명' : '상대팀'}</span></div>
        <div class="score"><span class="${cls(a, b)}">${sc(a)}</span><span class="colon">:</span><span class="${cls(b, a)}">${sc(b)}</span></div>
        <div class="side r"><span class="tn${b.win ? ' win' : ''}">${esc(b.name)}${b.external ? '' : ' 팀'}</span><span class="sc">${b.players.length ? b.players.length + '명' : '상대팀'}</span></div>
      </div>
      ${g.quarters.length > 1 && !b.external ? `<div class="qline">${g.quarters.map((q, i) => `<span>${q}Q <b>${a.quarters[i]}–${b.quarters[i]}</b></span>`).join('')}</div>` : ''}`;
  }
  const nameCounts = arr => arr.length
    ? `<div class="name-list">${arr.map(([n, c]) => `<span>${pbtn(n)}${c > 1 ? `<span class="cnt num">${c}</span>` : ''}</span>`).join('')}</div>`
    : '<span class="zero">없음</span>';

  function latestHtml(g) {
    if (!g) return '<div class="empty">아직 기록된 경기가 없습니다. games 폴더에 첫 경기 YAML을 추가하세요.</div>';
    const head = `<div class="latest-head"><span class="rnd">Round ${g.round}</span>${typeChip(g.type)}<span>${md(g.date)} (${wd(g.date)})</span><span>· ${esc(g.venue)}</span></div>`;
    let hero;
    if (isFutsal(g.type) || !g.teams || g.teams.length < 2) {
      hero = `<div class="futsal-hero">
        <div class="big"><span class="num">${g.attendees.length}</span><small>참석</small></div>
        <div class="big"><span class="num">${g.total_goals}</span><small>득점</small></div>
        ${g.scorers[0] ? `<div class="big"><span class="num" style="color:var(--pitch)">${g.scorers[0][1]}</span><small>최다 득점 · ${esc(g.scorers.filter(s => s[1] === g.scorers[0][1]).map(s => s[0]).join(', '))}</small></div>` : ''}
      </div>`;
    } else hero = gameScoreHtml(g);
    return `<article class="latest">${head}${hero}
      <div class="latest-body">
        <div class="kv"><b>득점</b><div>${nameCounts(g.scorers)}</div></div>
        ${!isFutsal(g.type) ? `<div class="kv"><b>도움</b><div>${nameCounts(g.assists)}</div></div>` : ''}
        <div class="kv"><b>참석</b><div class="name-list">${g.attendees.map(n => `<span>${pbtn(n)}</span>`).join('')}</div></div>
      </div></article>`;
  }

  function boardHtml(b, expanded) {
    const LIMIT = 7;
    const cut = b.rows.filter(r => r[0] <= LIMIT);
    const rows = expanded ? b.rows : cut;
    const sub = b.key === 'att' ? r => `<small>${Math.round(r[2] / DATA.total_games * 100)}%</small>` : () => '';
    return `<div class="lb" data-board="${b.key}">
      <div class="lb-h"><h3>${esc(b.title)}</h3><span>${b.member_only ? '회원 기준 · ' : ''}${esc(b.unit)}</span></div>
      ${rows.length ? `<ol>${rows.map(r => `<li class="${r[0] === 1 ? 'first' : ''}">
        <span class="rk">${r[0]}</span>${'<span style="min-width:0;display:flex;align-items:baseline">' + pbtn(r[1]) + '</span>'}
        ${deltaHtml(r[3])}<span class="val">${r[2]}${sub(r)}</span></li>`).join('')}</ol>` : '<div class="empty" style="margin:0 12px 12px">기록 없음</div>'}
      ${b.rows.length > cut.length ? `<button class="more" data-more="${b.key}">${expanded ? '접기' : `전체 ${b.rows.length}명 보기`}</button>` : ''}
    </div>`;
  }

  function renderSummary() {
    const field = DATA.games.filter(g => !isFutsal(g.type)).length;
    const goals = DATA.games.reduce((a, g) => a + g.total_goals, 0);
    const avgAtt = DATA.games.length ? DATA.games.reduce((a, g) => a + g.attendees.length, 0) / DATA.games.length : 0;
    const played = DATA.players.filter(p => p.att > 0).length;
    $('#view-summary').innerHTML = `
      <div class="block"><div class="head-row"><h2>최근 경기</h2>${DATA.latest ? `<span class="hint">순위 옆 ▲▼는 이 경기 직전 대비 변동</span>` : ''}</div>${latestHtml(latestGame)}</div>
      <div class="strip">
        <div><span class="num">${DATA.total_games}</span><small>경기 · 필드 ${field} / 풋살 ${DATA.total_games - field}</small></div>
        <div><span class="num">${goals}</span><small>총 득점</small></div>
        <div><span class="num">${avgAtt.toFixed(1)}</span><small>경기당 평균 참석</small></div>
        <div><span class="num">${played}</span><small>뛴 선수 (게스트 포함)</small></div>
      </div>
      <div class="block"><h2>부문별 순위</h2><div class="boards">${DATA.boards.map(b => boardHtml(b, false)).join('')}</div></div>`;
  }
  document.addEventListener('click', e => {
    const m = e.target.closest('[data-more]');
    if (!m) return;
    const b = DATA.boards.find(x => x.key === m.dataset.more);
    const card = m.closest('.lb');
    const expanded = m.textContent.trim() !== '접기';
    card.outerHTML = boardHtml(b, expanded);
  });

  // ── ranking ──
  const RCOLS = [
    ['rank', '순위', p => p.rank ?? 999, true],
    ['points', '포인트', p => p.points || 0],
    ['att', '출장', p => p.att || 0],
    ['futsal_goal', '골', p => p.futsal_goal || 0],
    ['field_wins', '승', p => p.field_wins || 0],
    ['field_goal', '골', p => p.field_goal || 0],
    ['field_assist', '도움', p => p.field_assist || 0],
    ['cs_q', '무실점', p => p.cs_q || 0],
    ['ref', '주심', p => p.ref || 0],
    ['aref', '부심', p => p.aref || 0],
  ];
  let rsort = { key: 'rank', asc: true };
  function renderRanking() {
    const col = RCOLS.find(c => c[0] === rsort.key);
    const list = [...members].sort((a, b) => {
      const d = col[2](a) - col[2](b);
      return (rsort.asc ? d : -d) || ((a.rank ?? 999) - (b.rank ?? 999));
    });
    const max = Math.max(1, ...members.map(p => p.points || 0));
    const th = (c, cls = '') => `<th class="sortable ${cls} ${rsort.key === c[0] ? 'sorted' + (rsort.asc ? ' asc' : '') : ''}" data-sort="${c[0]}">${c[1]}</th>`;
    const w = DATA.weights;
    const wr = (label, k) => `<tr><td class="l">${label}</td>${['풋살', '8:8', '9:9', '11:11'].map(t => `<td>${w[t] && w[t][k] != null ? w[t][k] : '–'}</td>`).join('')}</tr>`;
    $('#view-ranking').innerHTML = `
      <div class="block">
        <div class="head-row"><h2>파워랭킹 · 회원 ${members.length}명</h2><span class="hint">열 제목을 누르면 정렬</span></div>
        <div class="tbl-wrap"><table>
          <thead>
            <tr class="group-head"><th colspan="4"></th><th>풋살</th><th colspan="4">필드 (8:8 · 9:9 · 11:11)</th><th colspan="2">심판</th></tr>
            <tr>${th(RCOLS[0])}<th class="l sticky-col">이름</th>${th(RCOLS[1], 'l')}${th(RCOLS[2])}${RCOLS.slice(3).map(c => th(c)).join('')}</tr>
          </thead>
          <tbody>${list.map(p => `<tr>
            <td class="num">${p.rank ?? '–'} ${deltaHtml(p.prev_rank == null ? (DATA.latest ? 'new' : null) : p.prev_rank - p.rank)}</td>
            <td class="l sticky-col">${pbtn(p.name)}${p.status && p.status !== '정회원' ? ` <span class="guest">${esc(p.status)}</span>` : ''}</td>
            <td class="l num"><span class="ptbar" style="width:${Math.round((p.points || 0) / max * 90)}px"></span>${p.points || 0}</td>
            <td class="num">${p.att || 0}<span class="hint"> ${Math.round((p.att_rate || 0) * 100)}%</span></td>
            ${['futsal_goal', 'field_wins', 'field_goal', 'field_assist', 'cs_q', 'ref', 'aref'].map(k => `<td class="num">${zero(p[k])}</td>`).join('')}
          </tr>`).join('')}</tbody>
        </table></div>
      </div>
      <details class="note"><summary>포인트 계산 방식</summary><div class="inner">
        <span>출석 1경기당 ${w.attendance}점, 주심 쿼터당 ${w.referee}점, 부심 쿼터당 ${w.assistant_referee}점에 아래 경기 유형별 점수를 더합니다. 무실점은 실점 없이 끝난 쿼터에 뛴 선수 모두에게 쿼터마다 줍니다. 순위 변동은 가장 최근 경기를 빼고 계산한 순위와 비교한 값입니다.</span>
        <div class="tbl-wrap"><table><thead><tr><th class="l">항목</th><th>풋살</th><th>8:8</th><th>9:9</th><th>11:11</th></tr></thead>
        <tbody>${wr('승리', 'win')}${wr('득점', 'goal')}${wr('도움', 'assist')}${wr('무실점 (쿼터)', 'clean_sheet')}</tbody></table></div>
      </div></details>`;
  }
  $('#view-ranking').addEventListener('click', e => {
    const t = e.target.closest('[data-sort]');
    if (!t) return;
    const k = t.dataset.sort;
    rsort = rsort.key === k ? { key: k, asc: !rsort.asc } : { key: k, asc: k === 'rank' };
    renderRanking();
  });

  // ── games ──
  let gfilter = 'all';
  function gameResult(g) {
    if (isFutsal(g.type) || !g.teams || g.teams.length < 2) {
      const top = g.scorers[0];
      return `<span class="num">${g.total_goals}</span>골 · ${top ? `최다 ${esc(top[0])} ${top[1]}` : '득점 기록 없음'}`;
    }
    const [a, b] = g.teams;
    const s = t => t.goals === null ? '?' : t.goals;
    return `<span class="${a.win ? 'w' : ''}">${esc(a.name)}</span> <span class="num">${s(a)}</span> : <span class="num">${s(b)}</span> <span class="${b.win ? 'w' : ''}">${esc(b.name)}</span>`;
  }
  function gameDetail(g) {
    let h = '';
    if (!isFutsal(g.type) && g.teams && g.teams.length > 1 && g.quarters.length > 1 && !g.teams[1].external) {
      h += `<div class="tbl-wrap" style="align-self:flex-start;max-width:100%"><table class="qt"><thead><tr><th class="l">팀</th>${g.quarters.map(q => `<th>${q}Q</th>`).join('')}<th>합계</th></tr></thead>
        <tbody>${g.teams.map(t => `<tr><td class="l">${t.win ? '<b class="res-w">' + esc(t.name) + '</b>' : esc(t.name)}</td>${t.quarters.map(v => `<td class="num">${zero(v)}</td>`).join('')}<td class="num"><b>${t.goals}</b></td></tr>`).join('')}</tbody></table></div>`;
    }
    h += `<div class="kv"><b>득점</b><div>${nameCounts(g.scorers)}</div></div>`;

  // ── synergy ──
  const SY = DATA.synergy || { players: [], apps: [], pairs: [], quarters: 0, min_q: 3 };

  const pairMeta = p => `<span>함께 <b>${p[4]}</b>쿼터</span><span>승률 <b>${pct(p[5], p[4])}</b></span><span>공격P <b>${(p[6] / p[4]).toFixed(1)}</b>/쿼터</span><span>무실점 <b>${pct(p[7], p[4])}</b></span>`;
  const strong = SY.pairs.filter(p => !p[3]);
  const bestSort = (a, b) => b[2] - a[2] || b[4] - a[4] || b[5] / b[4] - a[5] / a[4];

  let synSel = store.get('syn:' + DATA.season);
  if (!(synSel in SYI)) synSel = SY.players[0];
  let showWeak = false;

  function partnersOf(name) {

  function pairList(list, title, sub) {
    return `<div class="pairs"><div class="lb-h"><h3>${title}</h3><span>${sub}</span></div>
      <ol>${list.map(p => `<li><span class="duo">${pbtn(SY.players[p[0]])}<span class="plus">+</span>${pbtn(SY.players[p[1]])}</span>${pips(p[2])}<span class="pmeta">${pairMeta(p)}</span></li>`).join('')}</ol></div>`;

  function partnerHtml() {
    if (!synSel) return '';
    const all = partnersOf(synSel);

    const best = st.slice().sort((a, b) => bestSort(a.p, b.p)).slice(0, 5);
    const worst = st.slice().sort((a, b) => worstSort(a.p, b.p)).slice(0, 5);

  function matrixHtml() {

        <tbody>${logs.map(l => { const g = G[l.gid]; const fut = isFutsal(g.type); const hasRes = !fut && g.teams && g.teams.some(t => t.win); return `<tr>
          <td class="l"><b>R${g.round}</b> <span class="hint">${md(g.date)}</span></td><td class="l">${typeChip(g.type)}</td><td class="l">${esc(l.team || '–')}</td>
          <td>${fut || !l.team ? '<span class="zero">–</span>' : (l.win ? '<span class="res-w">승</span>' : (hasRes ? '<span class="res-l">패</span>' : '<span class="res-l">무</span>'))}</td>
          <td class="num">${fut ? '<span class="zero">–</span>' : zero(l.quarters)}</td><td class="num">${zero(l.goal)}</td><td class="num">${fut ? '<span class="zero">–</span>' : zero(l.assist)}</td>
          <td class="num">${fut ? '<span class="zero">–</span>' : zero(l.cs)}</td><td class="num">${zero(l.ref)}</td></tr>`; }).join('')}</tbody></table></div></div>` : ''}
    </article>`;
  }

  function renderPlayers(keepFocus) {
    const pool = [...DATA.players].filter(p => p.att > 0 || p.member);
    const hits = pool.filter(p => matches(p.name, query));
    if (query && hits.length === 1) selected = hits[0].name;
    const regular = p => p.member && (p.status || '정회원') === '정회원';
    const tag = p => regular(p) ? (p.rank ? p.rank + '위' : '') : (p.member ? esc(p.status) : '');
    const chip = p => `<button class="pchip ${p.att ? '' : 'dim'}" data-pick="${esc(p.name)}" aria-pressed="${p.name === selected}">${esc(p.name)}<span class="num">${tag(p)}</span></button>`;
    const regs = hits.filter(regular);
    const others = hits.filter(p => !regular(p));
    const openOthers = !!query || others.some(p => p.name === selected);
    const listHtml = hits.length
      ? `${regs.length ? `<div class="roster-pick">${regs.map(chip).join('')}</div>` : ''}
         ${others.length ? `<details class="others" ${openOthers ? 'open' : ''}><summary>게스트 · 기타 <span class="num">${others.length}</span>명</summary><div class="roster-pick">${others.map(chip).join('')}</div></details>` : ''}`
      : `<div class="empty">'${esc(query)}'에 맞는 선수가 없습니다. 이름 일부나 초성(예: ㅂㅊㅇ)으로 찾아보세요.</div>`;
    const v = $('#view-players');
    if (!keepFocus) {
      v.innerHTML = `<div class="block"><h2>선수 검색</h2>
        <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="psearch" type="search" placeholder="이름 또는 초성으로 검색 (예: 박찬웅, ㅂㅊㅇ)" autocomplete="off" value="${esc(query)}"></label>
        <div id="plist" class="plist"></div></div><div id="pprofile"></div>`;
      $('#psearch').addEventListener('input', e => { query = e.target.value.trim(); renderPlayers(true); });
    }
    $('#plist').innerHTML = listHtml;
    $('#pprofile').innerHTML = profileHtml(P[selected]);
  }
  $('#view-players').addEventListener('click', e => {
    const b = e.target.closest('[data-pick]');
    if (!b) return;
    selected = b.dataset.pick; store.set('player:' + DATA.season, selected);
    renderPlayers(true);
    $('#pprofile').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  });

  // ── tabs ──
  const TABS = ['summary', 'ranking', 'games', 'synergy', 'players'];
  const rendered = {};
  const R = { summary: renderSummary, ranking: renderRanking, games: renderGames, synergy: renderSynergy, players: () => renderPlayers(false) };
  function show(tab, push) {
    if (!TABS.includes(tab)) tab = 'summary';
    TABS.forEach(t => {
      $('#view-' + t).hidden = t !== tab;
      $('#tab-' + t).setAttribute('aria-selected', t === tab);
    });
    if (!rendered[tab] || tab === 'players') { R[tab](); rendered[tab] = true; }
    if (push) history.replaceState(null, '', '#' + tab);
  }
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { show(b.dataset.tab, true); window.scrollTo(0, 0); }));
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-player]');
    if (!b) return;
    selected = b.dataset.player; query = ''; store.set('player:' + DATA.season, selected);
    show('players', true); window.scrollTo(0, 0);
  });
  window.addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
})();
</script>
</body>
</html>
